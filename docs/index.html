<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavagna</title>
  <meta name="description" content="A prompt-writing blackboard for VS Code and Cursor. Boards are plain markdown, with visual editors for trees, tables, flowcharts and sketches.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#22272b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lavagna">
  <meta property="og:description" content="A prompt-writing blackboard for VS Code and Cursor.">
  <!-- og:url and og:image must be absolute, so both hardcode the Pages origin.
       Update them together the day this site moves to a custom domain (CNAME). -->
  <meta property="og:url" content="https://aylosrd.github.io/lavagna/">
  <meta property="og:image" content="https://aylosrd.github.io/lavagna/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #22272b; color: #f2efe9; }
    main { text-align: center; padding: 2rem; }
    .mark { font-size: 5rem; line-height: 1; }
    h1 { font-weight: 600; letter-spacing: .02em; margin: .5rem 0 .25rem; }
    p { margin: 0 0 1rem; opacity: .8; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">꩜</div>
    <h1>Lavagna</h1>
    <p>A prompt-writing blackboard for VS Code and Cursor.</p>
    <p><a href="https://github.com/AyloSrd/lavagna">github.com/AyloSrd/lavagna</a></p>
  </main>
</body>
</html>
